<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Transactions</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/savings_transactions.css">
    <script src="js/core_manager.js"></script>
    <style>
        #loader-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999999;
            transition: opacity 0.5s ease;
        }
        #loader-wrapper img {
            width: 100px;
            height: auto;
        }
    </style>
</head>
<body>
    <div id="loader-wrapper">
        <img src="assets/images/loader.gif" alt="Loading...">
    </div>
    <div class="txn-container">
        <!-- Main Header -->
        <header class="txn-header-main">
            <h1 class="pay-title">Pay</h1>
            <div class="header-right-info">
                <div class="upi-details">
                    <div class="upi-main-logo">
                        <img src="assets/images/upi_logo.png" alt="UPI" style="height: 20px; margin-bottom: -6px; opacity: 1;">
                    </div>
                    <span class="upi-id" style="line-height: 1;">7415448245@idfcfirst
                        <!-- QR Scan SVG -->
                        <svg width="32" height="32" viewBox="0 0 192 192" fill="none" xmlns="http://www.w3.org/2000/svg" style="margin-left: 8px; vertical-align: middle; transform: translateY(-12px); opacity: 0.95;">
                            <path fill="#FFD700" d="M108 108h23.226Z"></path>
                            <path stroke="#FFD700" stroke-linecap="round" stroke-linejoin="round" stroke-width="12" d="M108 108h23.226"></path>
                            <path fill="#FFD700" d="M148.646 108H168Z"></path>
                            <path stroke="#FFD700" stroke-linecap="round" stroke-linejoin="round" stroke-width="12" d="M148.646 108H168"></path>
                            <path fill="#FFD700" d="M108 128h11.613Z"></path>
                            <path stroke="#FFD700" stroke-linecap="round" stroke-linejoin="round" stroke-width="12" d="M108 128h11.613"></path>
                            <path fill="#FFD700" d="M137.032 128H168Z"></path>
                            <path stroke="#FFD700" stroke-linecap="round" stroke-linejoin="round" stroke-width="12" d="M137.032 128H168"></path>
                            <path fill="#FFD700" d="M108 148h23.226Z"></path>
                            <path stroke="#FFD700" stroke-linecap="round" stroke-linejoin="round" stroke-width="12" d="M108 148h23.226"></path>
                            <path fill="#FFD700" d="M148.646 148H168Z"></path>
                            <path stroke="#FFD700" stroke-linecap="round" stroke-linejoin="round" stroke-width="12" d="M148.646 148H168"></path>
                            <path fill="#FFD700" d="M108 168h5.806Z"></path>
                            <path stroke="#FFD700" stroke-linecap="round" stroke-linejoin="round" stroke-width="12" d="M108 168h5.806"></path>
                            <path fill="#FFD700" d="M131.226 168H168Z"></path>
                            <path stroke="#FFD700" stroke-linecap="round" stroke-linejoin="round" stroke-width="12" d="M131.226 168H168"></path>
                            <rect width="62" height="62" x="22" y="22" stroke="currentColor" stroke-width="12" rx="10"></rect>
                            <rect width="62" height="62" x="22" y="108" stroke="currentColor" stroke-width="12" rx="10"></rect>
                            <rect width="62" height="62" x="108" y="22" stroke="currentColor" stroke-width="12" rx="10"></rect>
                            <rect width="22" height="22" x="42" y="42" fill="currentColor" rx="3"></rect>
                            <rect width="22" height="22" x="42" y="128" fill="currentColor" rx="3"></rect>
                            <rect width="22" height="22" x="128" y="42" fill="currentColor" rx="3"></rect>
                        </svg>
                    </span>
                </div>
                <div class="profile-circle">LC</div>
            </div>
        </header>

        <nav class="txn-tabs">
            <div class="tab-item">Payments</div>
            <div class="tab-item">Requests</div>
            <div class="tab-item active">Transactions</div>
            <div class="tab-item">Recurring</div>
            <div class="tab-item">Money Manager</div>
        </nav>

        <main class="txn-list-content">
            <!-- Dynamic transactions will be inserted here -->
        </main>

        <nav class="bottom-nav">
            <div class="nav-item" onclick="window.location.href='dashboard.html'">
                <img src="assets/images/home.svg" alt="Home">
                <span>HOME</span>
            </div>
            <div class="nav-item" onclick="window.location.href='accounts.html'">
                <img src="assets/images/accounts.svg" alt="Accounts">
                <span>ACCOUNTS</span>
            </div>
            <div class="nav-item active">
                <div class="nav-icon-wrapper">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M6 4H10.5M10.5 4C12.9853 4 15 6.01472 15 8.5C15 10.9853 12.9853 13 10.5 13H6L13 20M10.5 4H18M6 8.5H18" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
                    </svg>
                </div>
                <span>PAY</span>
            </div>
            <div class="nav-item">
                <img src="assets/images/savings.svg" alt="Loans">
                <span>LOANS</span>
            </div>
            <div class="nav-item">
                <img src="assets/images/qr_scan_v2.svg" alt="Scan">
                <span>SCAN</span>
            </div>
        </nav>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const txnListBody = document.querySelector('.txn-list-content');

            const user = await loadAppData();
            if (!user) return;

            // Update Header Info
            const upiElem = document.querySelector('.upi-id');
            if (upiElem && upiElem.childNodes[0]) {
                upiElem.childNodes[0].textContent = `${user.accountNumber.replace(/ /g, '')}@idfcfirst `;
            }

            const initials = user.fullName ? user.fullName.split(' ').map(n => n[0]).join('').toUpperCase() : 'UC';
            const profileCircle = document.querySelector('.profile-circle');
            if (profileCircle) profileCircle.textContent = initials;

            // Fetch Transactions
            const allTxns = getTransactionsForActiveUser();
            const savingsTxns = allTxns.filter(t => !t.category || t.category === 'savings');

            const bannerHtml = `
                <div class="networth-promo-banner">
                    <div class="banner-text-content">
                        <p class="banner-text">See the impact of your last transaction on your Networth</p>
                    </div>
                    <button class="btn-unlock-networth" onclick="window.location.href='dashboard.html'">Unlock Networth</button>
                </div>
            `;

            if (savingsTxns.length === 0) {
                txnListBody.innerHTML = '<p style="text-align:center; padding:50px; color:#888;">No savings transactions found.</p>' + bannerHtml;
                return;
            }

            const currentBalance = user.availableBalance || '₹ 0.00';
            const grouped = {};
            savingsTxns.forEach(txn => {
                if (!grouped[txn.date]) grouped[txn.date] = [];
                grouped[txn.date].push(txn);
            });

            const sortedDates = Object.keys(grouped).sort((a, b) => new Date(b) - new Date(a));
            let bannerPlaced = false;
            const yesterdayDate = new Date();
            yesterdayDate.setDate(yesterdayDate.getDate() - 1);
            const yesterdayStr = yesterdayDate.toDateString();

            let finalHtml = '';

            sortedDates.forEach((date) => {
                const txnDateObj = new Date(date);
                const isYesterdayGroup = txnDateObj.toDateString() === yesterdayStr;

                if (isYesterdayGroup && !bannerPlaced) {
                    finalHtml += bannerHtml;
                    bannerPlaced = true;
                }

                const todayStr = new Date().toDateString();
                let headerText = date;
                if (txnDateObj.toDateString() === todayStr) headerText = 'Today';
                else if (txnDateObj.toDateString() === yesterdayStr) headerText = 'Yesterday';

                finalHtml += `<div class="date-group-header">${headerText} | Balance ${currentBalance}</div>`;

                grouped[date].forEach(txn => {
                    const isIncoming = txn.amount.includes('+') || txn.desc.toLowerCase().includes('deposit');
                    finalHtml += `
                        <div class="txn-card">
                            <div class="txn-icon-circle">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M19,7 L5,7 M20,17 L5,17" stroke="#931A1D" stroke-width="2" stroke-linecap="round"></path>
                                    <path d="M16,3 L19.2929,6.29289 C19.6834,6.68342 19.6834,7.31658 19.2929,7.70711 L16,11" stroke="#931A1D" stroke-width="2" stroke-linecap="round"></path>
                                    <path d="M8,13 L4.70711,16.2929 C4.31658,16.6834 4.31658,17.3166 4.70711,17.7071 L8,21" stroke="#931A1D" stroke-width="2" stroke-linecap="round"></path>
                                </svg>
                            </div>
                            <div class="txn-info-main">
                                <p class="txn-name">${txn.desc.split('/')[0] || txn.desc}</p>
                                <p class="txn-subtitle">${txn.desc}</p>
                            </div>
                            <div class="txn-amount-box">
                                <p class="txn-amount ${isIncoming ? 'incoming' : ''}">${txn.amount}</p>
                                <p class="txn-time">${txn.date}</p>
                            </div>
                        </div>
                    `;
                });
            });

            if (!bannerPlaced) finalHtml += bannerHtml;
            txnListBody.innerHTML = finalHtml;
        });

        window.addEventListener('load', function() {
            var loader = document.getElementById('loader-wrapper');
            setTimeout(function() {
                loader.style.opacity = '0';
                setTimeout(function() { loader.style.display = 'none'; }, 500);
            }, 1000);
        });
    </script>
</body>
</html>
