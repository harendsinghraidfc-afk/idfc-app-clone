<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scan QR</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-screen: #edf2f7;
            --bg-soft: #dfe7ef;
            --text-dark: #1a1a1a;
            --text-mid: #2e2e2e;
            --text-light: #6c7a89;
            --brand-red: #a51d2e;
            --border-soft: rgba(17, 17, 17, 0.2);
            --white: #ffffff;
            --chip: rgba(255,255,255,0.5);
        }

        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            font-family: 'Inter', sans-serif;
            background: #d9dde4;
            color: var(--text-dark);
        }

        body {
            margin: 0;
            overflow: hidden;
            background: #ffffff;
        }

        .phone-shell {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #ffffff;
            overflow: hidden;
        }

        .status-bar {
            height: 48px;
            padding: 0 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.97);
            gap: 12px;
        }

        .back-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: transparent;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #8B1538;
            cursor: pointer;
            padding: 0;
            flex-shrink: 0;
        }

        .back-btn svg {
            width: 28px;
            height: 28px;
            stroke: currentColor;
            stroke-width: 2.8;
        }

        .close-x-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: transparent;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #8B1538;
            cursor: pointer;
            padding: 0;
            flex-shrink: 0;
        }

        .close-x-btn svg {
            width: 24px;
            height: 24px;
            stroke: currentColor;
            stroke-width: 2.8;
        }

        .close-btn {
            display: none;
        }

        .scan-header {
            position: relative;
            width: 100%;
            background: rgba(255, 255, 255, 0.97);
            border-bottom: 1px solid rgba(31, 41, 55, 0.08);
            box-shadow: 0 6px 18px rgba(17, 17, 17, 0.04);
            border-radius: 0 0 22px 22px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: flex-start;
            padding: 14px 18px 12px 18px;
            margin-top: 0;
            min-height: 68px;
        }

        .scan-title-wrap {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
            min-height: 62px;
            padding-top: 0;
        }

        .scan-title {
            font-size: clamp(1.4rem, 2.5vw, 2.2rem);
            line-height: 0.95;
            letter-spacing: -0.06em;
            font-weight: 700;
            color: var(--text-dark);
            margin: 0;
        }

        .supported-by {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: #5d6976;
            font-weight: 600;
            white-space: nowrap;
        }

        .supported-by .brands {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
            color: #1a1a1a;
        }

        .brand-visa { color: #1a1f71; }
        .brand-upi { color: #2d7af7; }
        .brand-rupee { color: #d1282b; }

        .scan-body {
            position: relative;
            height: calc(100vh - 100px);
            min-height: 420px;
            background: linear-gradient(180deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.02) 100%);
        }

        .scan-body::before {
            display: none;
        }

        .scan-section {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding-top: 24px;
        }

        .camera-outline {
            width: 100px;
            height: 100px;
            border: none;
            border-radius: 22px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
        }

        .camera-outline::before {
            display: none;
        }

        .camera-icon {
            width: 48px;
            height: 48px;
            color: #1b1f24;
            opacity: 1;
            fill: #1b1f24;
        }

        .permission-text {
            margin-top: 24px;
            width: min(82%, 460px);
            text-align: center;
            font-size: clamp(0.95rem, 1.6vw, 1.6rem);
            line-height: 1.3;
            letter-spacing: -0.04em;
            color: rgba(28, 31, 38, 0.92);
            font-weight: 500;
        }

        .action-block {
            position: relative;
            z-index: 1;
            margin-top: 22px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .allow-btn {
            background: transparent;
            border: none;
            font-size: clamp(1.2rem, 1.6vw, 1.8rem);
            letter-spacing: -0.06em;
            font-weight: 800;
            color: var(--brand-red);
            cursor: pointer;
            margin: 0;
            padding: 0;
        }

        .gallery-btn {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            border: 1px solid rgba(0,0,0,0.1);
            background: rgba(255,255,255,0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 3px 12px rgba(0,0,0,0.06);
            cursor: pointer;
        }

        .gallery-btn svg {
            width: 34px;
            height: 34px;
            stroke: #8B1538;
        }

        .gallery-label {
            font-size: clamp(0.85rem, 1.3vw, 1.3rem);
            font-weight: 500;
            color: rgba(24, 28, 35, 0.9);
            letter-spacing: -0.04em;
        }

        .bottom-indicator {
            position: absolute;
            left: 50%;
            bottom: 14px;
            transform: translateX(-50%);
            width: 60%;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            opacity: 0.9;
        }

        .bottom-indicator .bar {
            width: 68px;
            height: 4px;
            background: rgba(12,12,12,0.7);
            border-radius: 12px;
        }

        .bottom-indicator .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(12,12,12,0.7);
        }

        @media (max-width: 420px) {
            .scan-title-wrap { gap: 4px; }
            .supported-by { font-size: 10px; }
            .scan-body { min-height: 440px; }
        }

        .camera-view {
            display: none;
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            background: #000;
            overflow: hidden;
        }

        .camera-view.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .camera-view video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .permission-screen.hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="phone-shell">
        <div class="status-bar">
            <button class="back-btn" onclick="window.history.back()" aria-label="Back">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18L9 12L15 6"/></svg>
            </button>
            <button class="close-x-btn" onclick="window.history.back()" aria-label="Close">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6L18 18M18 6L6 18"/></svg>
            </button>
        </div>

        <div class="scan-header">
            <div class="scan-title-wrap">
                <h1 class="scan-title">Scan QR code</h1>
                <div class="supported-by">
                    <span>Supported by</span>
                    <div class="brands">
                        <span class="brand-visa">VISA</span>
                        <span class="brand-upi">UPI</span>
                        <span class="brand-rupee">₹</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="scan-body">
            <div class="scan-section">
                <div class="camera-outline">
                    <svg class="camera-icon" viewBox="256 465 32 32" version="1.1" xmlns="http://www.w3.org/2000/svg" fill="currentColor" aria-hidden="true">
                        <path d="M272,487 C268.687,487 266,484.313 266,481 C266,477.687 268.687,475 272,475 C275.313,475 278,477.687 278,481 C278,484.313 275.313,487 272,487 L272,487 Z M272,473 C267.582,473 264,476.582 264,481 C264,485.418 267.582,489 272,489 C276.418,489 280,485.418 280,481 C280,476.582 276.418,473 272,473 L272,473 Z M286,489 C286,490.104 285.104,491 284,491 L260,491 C258.896,491 258,490.104 258,489 L258,473 C258,471.896 258.896,471 260,471 L264,471 L265,469 C265.707,467.837 265.896,467 267,467 L277,467 C278.104,467 278.293,467.837 279,469 L280,471 L284,471 C285.104,471 286,471.896 286,473 L286,489 L286,489 Z M284,469 L281,469 L280,467 C279.411,465.837 279.104,465 278,465 L266,465 C264.896,465 264.53,465.954 264,467 L263,469 L260,469 C257.791,469 256,470.791 256,473 L256,489 C256,491.209 257.791,493 260,493 L284,493 C286.209,493 288,491.209 288,489 L288,473 C288,470.791 286.209,469 284,469 L284,469 Z" />
                    </svg>
                </div>

                <p class="permission-text">To make faster payments using scan QR,<br>please provide camera access</p>
            </div>

            <div class="action-block">
                <button class="allow-btn" type="button" onclick="requestCameraAccess()">Allow camera access</button>

                <div class="gallery-btn" aria-label="Upload from gallery">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <circle cx="16" cy="8" r="2" stroke="#8B1538" stroke-width="1.5"></circle>
                        <path d="M2 12.5001L3.75159 10.9675C4.66286 10.1702 6.03628 10.2159 6.89249 11.0721L11.1822 15.3618C11.8694 16.0491 12.9512 16.1428 13.7464 15.5839L14.0446 15.3744C15.1888 14.5702 16.7369 14.6634 17.7765 15.599L21 18.5001" stroke="#8B1538" stroke-width="1.5" stroke-linecap="round"></path>
                        <path d="M22 12C22 16.714 22 19.0711 20.5355 20.5355C19.0711 22 16.714 22 12 22C7.28595 22 4.92893 22 3.46447 20.5355C2 19.0711 2 16.714 2 12C2 7.28595 2 4.92893 3.46447 3.46447C4.92893 2 7.28595 2 12 2C16.714 2 19.0711 2 20.5355 3.46447C21.5093 4.43821 21.8356 5.80655 21.9449 8" stroke="#8B1538" stroke-width="1.5" stroke-linecap="round"></path>
                    </svg>
                </div>
                <div class="gallery-label">Upload from gallery</div>
            </div>

            <div class="bottom-indicator" aria-hidden="true">
                <span class="bar"></span>
                <span class="dot"></span>
                <span class="bar"></span>
            </div>
        </div>

        <div class="camera-view" id="cameraView">
            <video id="cameraVideo" autoplay playsinline></video>
        </div>
    </div>

    <script>
        async function requestCameraAccess() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                const video = document.getElementById('cameraVideo');
                video.srcObject = stream;
                
                const cameraView = document.getElementById('cameraView');
                cameraView.classList.add('active');
            } catch (error) {
                console.error('Error accessing camera:', error);
                alert('Unable to access camera. Please check permissions and try again.');
            }
        }
    </script>
</body>
</html>
