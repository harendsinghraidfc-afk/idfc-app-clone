<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scan QR</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; padding: 0; background: #000; color: white; font-family: 'Inter', sans-serif; overflow: hidden; height: 100vh; }
        .scan-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .scan-frame { width: 250px; height: 250px; border: 2px solid rgba(255,255,255,0.5); border-radius: 20px; position: relative; }
        .scan-frame::before { content: ''; position: absolute; top: -2px; left: -2px; width: 40px; height: 40px; border-top: 4px solid #fff; border-left: 4px solid #fff; border-radius: 20px 0 0 0; }
        .scan-frame::after { content: ''; position: absolute; top: -2px; right: -2px; width: 40px; height: 40px; border-top: 4px solid #fff; border-right: 4px solid #fff; border-radius: 0 20px 0 0; }
        .corner-bottom-left { position: absolute; bottom: -2px; left: -2px; width: 40px; height: 40px; border-bottom: 4px solid #fff; border-left: 4px solid #fff; border-radius: 0 0 0 20px; }
        .corner-bottom-right { position: absolute; bottom: -2px; right: -2px; width: 40px; height: 40px; border-bottom: 4px solid #fff; border-right: 4px solid #fff; border-radius: 0 0 20px 0; }

        .scan-line { position: absolute; top: 0; left: 10px; width: calc(100% - 20px); height: 2px; background: #931A1D; box-shadow: 0 0 15px #931A1D; animation: scan 3s infinite linear; }
        @keyframes scan { 0% { top: 10px; } 50% { top: 240px; } 100% { top: 10px; } }

        .scan-text { margin-top: 40px; font-size: 1.1rem; font-weight: 500; text-align: center; color: rgba(255,255,255,0.8); }
        .close-btn { position: absolute; top: 30px; right: 20px; width: 40px; height: 40px; background: rgba(255,255,255,0.1); border-radius: 50%; display: flex; justify-content: center; align-items: center; }

        /* Bottom Nav Fix (Matching App) */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; height: 70px; background: #111; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #222; }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 5px; color: #666; text-decoration: none; font-size: 0.65rem; font-weight: 700; }
        .nav-item.active { color: #fff; }
        .nav-icon { width: 22px; height: 22px; filter: grayscale(1) opacity(0.5); }
        .nav-item.active .nav-icon { filter: none; opacity: 1; }
    </style>
</head>
<body>
    <div class="close-btn" onclick="window.history.back()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
    </div>

    <div class="scan-overlay">
        <div class="scan-frame">
            <div class="scan-line"></div>
            <div class="corner-bottom-left"></div>
            <div class="corner-bottom-right"></div>
        </div>
        <p class="scan-text">Align QR code within the frame to scan</p>
    </div>

    <!-- Minimal bottom nav to match app context -->
    <nav class="bottom-nav">
        <div class="nav-item" onclick="window.location.href='dashboard.html'"><img src="assets/images/home.svg" class="nav-icon" alt="Home"><span>HOME</span></div>
        <div class="nav-item" onclick="window.location.href='accounts.html'"><img src="assets/images/accounts.svg" class="nav-icon" alt="Accounts"><span>ACCOUNTS</span></div>
        <div class="nav-item" onclick="window.location.href='savings_transactions.html?tab=payments'"><img src="assets/images/pay.svg" class="nav-icon" alt="Pay"><span>PAY</span></div>
        <div class="nav-item"><img src="assets/images/savings.svg" class="nav-icon" alt="Loans"><span>LOANS</span></div>
        <div class="nav-item active" onclick="window.location.href='scan.html'"><img src="assets/images/qr_scan_v2.svg" class="nav-icon" style="filter: none; opacity: 1;" alt="Scan"><span>SCAN</span></div>
    </nav>
</body>
</html>
