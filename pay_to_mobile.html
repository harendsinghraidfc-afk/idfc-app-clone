<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pay to UPI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <style>
        :root {
            --idfc-maroon: #931A1D;
            --text-dark: #1A1A1A;
            --text-grey: #666666;
            --text-light-grey: #999999;
            --bg-page: #FFFFFF;
        }

        body {
            background-color: var(--bg-page);
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            color: var(--text-dark);
            -webkit-tap-highlight-color: transparent;
        }

        /* Header */
        .header {
            background: white;
            padding: 12px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #F0F0F0;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-left {
            display: flex;
            align-items: center;
        }
        .back-btn {
            background: none;
            border: none;
            padding: 5px;
            cursor: pointer;
            color: #333;
            margin-right: 15px;
            display: flex;
            align-items: center;
        }
        .header-title {
            font-size: 1.05rem;
            font-weight: 700;
        }
        .header-right .search-icon-btn {
            background: none;
            border: none;
            padding: 5px;
            color: var(--idfc-maroon);
        }

        /* Search Section */
        .search-area {
            padding: 18px;
        }
        .search-box {
            background: #FFFFFF;
            border: 1px solid #E5E5E5;
            border-radius: 14px;
            height: 52px;
            display: flex;
            align-items: center;
            padding: 0 15px;
            gap: 10px;
        }
        .search-input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 0.95rem;
            color: #333;
            font-weight: 400;
        }
        .search-input::placeholder {
            color: var(--text-light-grey);
        }
        .abc-pill {
            background: #F2F2F2;
            padding: 2px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            user-select: none;
            border: 1px solid #E0E0E0;
        }
        .abc-pill span {
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #5F6368;
        }
        .abc-pill span.active {
            background: #000000;
            color: #FFFFFF;
        }

        /* Sections */
        .section-wrap {
            margin-top: 10px;
        }
        .section-head {
            padding: 10px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .section-title {
            font-size: 0.95rem;
            font-weight: 800;
            color: #000;
        }
        .manage-btn {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--idfc-maroon);
            text-decoration: none;
        }

        .empty-placeholder {
            padding: 30px 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .icon-circle {
            width: 44px;
            height: 44px;
            background: #F9F9F9;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #999;
            margin-bottom: 12px;
            border: 1px solid #EEE;
        }
        .placeholder-text {
            font-size: 0.85rem;
            color: var(--text-grey);
            font-weight: 500;
        }

        /* Promo Banner */
        .promo-banner {
            margin: 15px 18px;
            background: #FFF9E6; /* Soft yellow matching screenshot */
            border-radius: 16px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 15px;
            border: 1px solid #FEF1C7;
        }
        .promo-icon-circle {
            width: 42px;
            height: 42px;
            background: #FFD54F;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--idfc-maroon);
            font-weight: 800;
            font-size: 1.3rem;
            flex-shrink: 0;
            box-shadow: 0 2px 5px rgba(255, 213, 79, 0.3);
        }
        .promo-body {
            flex: 1;
        }
        .promo-title {
            font-size: 0.9rem;
            font-weight: 800;
            margin: 0 0 4px 0;
            color: #333;
        }
        .promo-desc {
            font-size: 0.78rem;
            color: #666;
            line-height: 1.4;
            margin: 0;
        }
        .promo-arrow {
            color: #AAA;
            font-size: 1.5rem;
            font-weight: 300;
        }

        /* Contacts Illustration */
        .contacts-area {
            margin-top: 15px;
        }
        .contacts-empty-state {
            padding: 50px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .illustration-box {
            position: relative;
            width: 140px;
            height: 100px;
            margin-bottom: 20px;
        }
        .phone-bg {
            position: absolute;
            width: 60px;
            height: 100px;
            background: #F0F0F0;
            border-radius: 10px;
            left: 40px;
            border: 2px solid #E0E0E0;
        }
        .contact-circle {
            position: absolute;
            width: 20px;
            height: 20px;
            background: #E0E0E0;
            border-radius: 50%;
            top: 20px;
            left: 60px;
        }
        .check-badge {
            position: absolute;
            width: 16px;
            height: 16px;
            background: #4CAF50;
            border-radius: 50%;
            bottom: 20px;
            right: 35px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 10px;
        }

        .contacts-msg {
            font-size: 0.95rem;
            color: #666;
            font-weight: 500;
        }

        /* Floating Action Button (FAB) */
        .fab-container {
            position: fixed;
            bottom: 30px;
            right: 20px;
            z-index: 999;
        }
        .new-payment-btn {
            background: #000000;
            color: #FFFFFF;
            padding: 14px 24px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 0.95rem;
            border: none;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            cursor: pointer;
        }
        .plus-icon {
            font-size: 1.5rem;
            line-height: 0;
            margin-top: -2px;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-left">
            <button class="back-btn" aria-label="Back" onclick="window.history.back()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            </button>
            <span class="header-title">Pay to UPI</span>
        </div>
        <div class="header-right">
            <button class="search-icon-btn" aria-label="Search">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
            </button>
        </div>
    </header>

    <div class="search-area">
        <div class="search-box">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" id="search-input" class="search-input" placeholder="Search Phone number" aria-label="Search Phone number">
            <div class="abc-pill">
                <span id="kb-abc" class="active">ABC</span>
                <span id="kb-123">123</span>
            </div>
        </div>
    </div>

    <div class="section-wrap">
        <div class="section-head">
            <span class="section-title">Recent payees</span>
            <a href="#" class="manage-btn">Manage</a>
        </div>
        <div class="empty-placeholder">
            <div class="icon-circle">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
            </div>
            <p class="placeholder-text">Your recent payees will appear here</p>
        </div>
    </div>

    <div class="promo-banner">
        <div class="promo-icon-circle">₹</div>
        <div class="promo-body">
            <p class="promo-title">Add Money</p>
            <p class="promo-desc">Add up to ₹5 Lakh with any UPI app and earn up to 6.5% p.a.</p>
        </div>
        <span class="promo-arrow">&rsaquo;</span>
    </div>

    <div class="contacts-area">
        <div class="section-head">
            <span class="section-title">All contacts</span>
        </div>
        <div class="contacts-empty-state">
            <div class="illustration-box">
                <div class="phone-bg"></div>
                <div class="contact-circle"></div>
                <div class="check-badge">✓</div>
            </div>
            <p class="contacts-msg">You do not have any saved contact</p>
        </div>
    </div>

    <div class="fab-container">
        <button class="new-payment-btn">
            <span class="plus-icon">+</span>
            <span>New payment</span>
        </button>
    </div>

    <script>
        const searchInput = document.getElementById('search-input');
        const abcBtn = document.getElementById('kb-abc');
        const numBtn = document.getElementById('kb-123');

        abcBtn.onclick = (e) => {
            e.stopPropagation();
            abcBtn.classList.add('active');
            numBtn.classList.remove('active');
            searchInput.inputMode = "text";
            searchInput.type = "text";
            searchInput.focus();
        };

        numBtn.onclick = (e) => {
            e.stopPropagation();
            numBtn.classList.add('active');
            abcBtn.classList.remove('active');
            searchInput.inputMode = "numeric";
            searchInput.focus();
        };
    </script>
    <script src="js/core_manager.js"></script>
</body>
</html>
