<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Account Statement</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/account_statement.css">
    <script src="js/core_manager.js"></script>
    <style>
        #loader-wrapper {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #ffffff; display: flex; justify-content: center; align-items: center;
            z-index: 999999; transition: opacity 0.5s ease;
        }
        #loader-wrapper img { width: 100px; height: auto; }

        /* Subtle background pattern like the image */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('assets/images/logo_v2.svg');
            background-size: 150px;
            background-repeat: repeat;
            opacity: 0.03;
            z-index: -1;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="loader-wrapper"><img src="assets/images/loader.gif" alt="Loading..."></div>

    <div class="statement-container">
        <!-- Header -->
        <header class="header">
            <span class="header-title">Account statement</span>
            <div class="header-icons">
                <!-- Headset/Support Icon -->
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2">
                    <path d="M3 18v-6a9 9 0 0 1 18 0v6"></path>
                    <path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"></path>
                </svg>
                <!-- Close Icon -->
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" onclick="window.history.back()">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </div>
        </header>

        <!-- Dynamic Account Info -->
        <div class="account-info" id="acc-info-display">A/c 102 9516 8767 - Mr. Lokesh Chouhan</div>

        <div class="section-label">Time period</div>

        <div class="radio-group">
            <div class="radio-item active" data-period="current">
                <div class="radio-circle"><div class="radio-inner"></div></div>
                <span class="radio-label">Current month</span>
            </div>
            <div class="radio-item" data-period="last">
                <div class="radio-circle"><div class="radio-inner"></div></div>
                <span class="radio-label">Last month</span>
            </div>
            <div class="radio-item" data-period="last3">
                <div class="radio-circle"><div class="radio-inner"></div></div>
                <span class="radio-label">Last 3 months</span>
            </div>
            <div class="radio-item" data-period="last6">
                <div class="radio-circle"><div class="radio-inner"></div></div>
                <span class="radio-label">Last 6 months</span>
            </div>
            <div class="radio-item" data-period="last12">
                <div class="radio-circle"><div class="radio-inner"></div></div>
                <span class="radio-label">Last 12 months</span>
            </div>
            <div class="radio-item" data-period="current-fy">
                <div class="radio-circle"><div class="radio-inner"></div></div>
                <span class="radio-label">Current Financial Year (Apr '26 - Mar '27)</span>
            </div>
            <div class="radio-item" data-period="last-fy">
                <div class="radio-circle"><div class="radio-inner"></div></div>
                <span class="radio-label">Last Financial Year (Apr '25 - Mar '26)</span>
            </div>
            <div class="radio-item" data-period="custom">
                <div class="radio-circle"><div class="radio-inner"></div></div>
                <span class="radio-label">Custom</span>
            </div>
        </div>

        <!-- Format Selector -->
        <div class="format-selector-wrapper">
            <span class="format-label">Select format</span>
            <div class="format-box" id="format-dropdown">
                <span class="selected-value" id="current-format">PDF</span>
                <div class="dropdown-arrow">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                </div>
                <div class="options-list">
                    <div class="option-item" data-value="PDF">PDF</div>
                    <div class="option-item" data-value="Excel">Excel</div>
                </div>
            </div>
        </div>

        <!-- Footer Actions -->
        <div class="footer-actions">
            <a href="#" class="email-btn">Email</a>
            <button class="download-btn" onclick="window.location.href='transaction_statement_view.html?autoprint=true'">Download</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const infoDisplay = document.getElementById('acc-info-display');

            // Radio button logic
            document.querySelectorAll('.radio-item').forEach(item => {
                item.addEventListener('click', () => {
                    document.querySelectorAll('.radio-item').forEach(i => i.classList.remove('active'));
                    item.classList.add('active');
                });
            });

            // Fetch Real User Data
            const user = await loadAppData();
            if (user) {
                infoDisplay.textContent = `A/c ${user.accountNumber} - Mr. ${user.welcomeName || user.fullName}`;
            }

            // Dropdown logic
            const dropdown = document.getElementById('format-dropdown');
            const selectedValue = document.getElementById('current-format');
            const options = document.querySelectorAll('.option-item');

            dropdown.addEventListener('click', (e) => {
                dropdown.classList.toggle('open');
                e.stopPropagation();
            });

            options.forEach(option => {
                option.addEventListener('click', (e) => {
                    selectedValue.textContent = option.getAttribute('data-value');
                    dropdown.classList.remove('open');
                    e.stopPropagation();
                });
            });

            document.addEventListener('click', () => dropdown.classList.remove('open'));
        });

        // Loader hide
        window.addEventListener('load', function() {
            var loader = document.getElementById('loader-wrapper');
            setTimeout(function() {
                loader.style.opacity = '0';
                setTimeout(function() { loader.style.display = 'none'; }, 500);
            }, 800);
        });
    </script>
</body>
</html>
