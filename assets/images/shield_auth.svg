<svg width="200" height="230" viewBox="0 0 200 230" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
            <feOffset dx="2" dy="5" result="offsetblur"/>
            <feComponentTransfer>
                <feFuncA type="linear" slope="0.3"/>
            </feComponentTransfer>
            <feMerge>
                <feMergeNode/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
        <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#B32025;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#931A1D;stop-opacity:1" />
        </linearGradient>
    </defs>

    <!-- Shield Body -->
    <path d="M100 210C100 210 180 170 180 90V40L100 20L20 40V90C20 170 100 210 100 210Z"
          fill="url(#shieldGrad)"
          stroke="#FFCCCC"
          stroke-width="5"
          filter="url(#shadow)"/>

    <!-- White Checkmark -->
    <path d="M60 110L90 145L145 85"
          stroke="white"
          stroke-width="18"
          stroke-linecap="round"
          stroke-linejoin="round"/>
</svg>
