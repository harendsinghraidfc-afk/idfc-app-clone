<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Transaction Statement - IDFC FIRST Bank</title>
    <script src="js/core_manager.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; margin: 0; padding: 40px; color: #333; }
        .header { display: flex; justify-content: space-between; border-bottom: 2px solid #931A1D; padding-bottom: 20px; margin-bottom: 30px; }
        .logo { height: 40px; }
        .bank-info { text-align: right; font-size: 0.8rem; line-height: 1.4; }
        .statement-title { font-size: 1.5rem; font-weight: 800; color: #931A1D; margin-bottom: 20px; text-transform: uppercase; }
        .user-details { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; font-size: 0.9rem; }
        .detail-item span { font-weight: 700; color: #666; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { background-color: #f8f9fa; color: #931A1D; text-align: left; padding: 12px; font-size: 0.85rem; border-bottom: 2px solid #dee2e6; }
        td { padding: 12px; font-size: 0.85rem; border-bottom: 1px solid #eee; }
        .amount { text-align: right; font-weight: 600; }
        .credit { color: #2e7d32; }
        .debit { color: #d32f2f; }
        .balance { font-weight: 800; text-align: right; }
        .footer { margin-top: 50px; font-size: 0.75rem; color: #999; text-align: center; border-top: 1px solid #eee; padding-top: 20px; }
        #loader-wrapper {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #ffffff; display: flex; justify-content: center; align-items: center;
            z-index: 999999; transition: opacity 0.5s ease;
        }
        #loader-wrapper img { width: 100px; height: auto; }
        @media print { .no-print { display: none; } body { padding: 20px; } }
    </style>
</head>
<body>
    <div id="loader-wrapper"><img src="assets/images/loader.gif" alt="Loading..."></div>
    <div class="no-print" style="background: #fdf4f4; padding: 15px; border-radius: 8px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center;">
        <span style="color: #931A1D; font-weight: 600;">Statement Preview - Dynamic Data</span>
        <button onclick="window.print()" style="background: #931A1D; color: white; border: none; padding: 8px 20px; border-radius: 20px; font-weight: 700; cursor: pointer;">Print to PDF</button>
    </div>

    <div class="header">
        <img src="assets/images/logo_v2.svg" class="logo" alt="IDFC FIRST Bank">
        <div class="bank-info"><strong>IDFC FIRST Bank Limited</strong><br>Chennai - 600031</div>
    </div>
    <div class="statement-title">Account Statement</div>
    <div class="user-details" id="user-info"></div>

    <table>
        <thead>
            <tr>
                <th>Date</th>
                <th>Description</th>
                <th style="text-align: right;">Debit (Dr)</th>
                <th style="text-align: right;">Credit (Cr)</th>
                <th style="text-align: right;">Balance</th>
            </tr>
        </thead>
        <tbody id="statement-body"></tbody>
    </table>

    <div class="footer">This is a computer generated statement. IDFC FIRST Bank Ltd.</div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const user = await loadAppData();
            if (!user) return;

            document.getElementById('user-info').innerHTML = `
                <div class="detail-item">
                    <span>Name:</span> ${user.fullName}<br>
                    <span>Account Number:</span> ${user.accountNumber}<br>
                    <span>Customer ID:</span> ${user.customerId}
                </div>
                <div class="detail-item" style="text-align: right;">
                    <span>Currency:</span> INR<br>
                    <span>Closing Balance:</span> ${user.availableBalance || '₹0.00'}
                </div>`;

            const txns = getTransactionsForActiveUser();
            const body = document.getElementById('statement-body');
            let runningBalance = parseFloat(user.availableBalance?.replace(/[^0-9.]/g, '')) || 0;

            txns.forEach(txn => {
                const isCredit = txn.amount.includes('+') || txn.desc.toLowerCase().includes('deposit');
                const amountVal = parseFloat(txn.amount.replace(/[^0-9.]/g, '')) || 0;

                const row = `
                    <tr>
                        <td>${txn.date}</td>
                        <td>${txn.desc}</td>
                        <td class="amount debit">${!isCredit ? txn.amount.replace('₹', '') : '-'}</td>
                        <td class="amount credit">${isCredit ? txn.amount.replace('₹', '') : '-'}</td>
                        <td class="balance">${runningBalance.toFixed(2)}</td>
                    </tr>`;
                body.insertAdjacentHTML('beforeend', row);
                // Simple balance simulation
                if(isCredit) runningBalance -= amountVal; else runningBalance += amountVal;
            });
        });

        window.addEventListener('load', function() {
            var loader = document.getElementById('loader-wrapper');
            setTimeout(function() { loader.style.opacity = '0'; setTimeout(function() { loader.style.display = 'none'; }, 500); }, 1000);
        });
    </script>
</body>
</html>
