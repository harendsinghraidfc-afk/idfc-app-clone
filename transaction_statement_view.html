<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Account Statement - IDFC FIRST Bank</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="js/core_manager.js"></script>
    <style>
        body { font-family: 'Arial', sans-serif; margin: 0; padding: 40px; color: #1a1a1a; background: white; line-height: 1.4; }
        .pdf-page { max-width: 900px; margin: 0 auto; position: relative; min-height: 1200px; }

        /* Logo & Tagline */
        .header-main { display: flex; flex-direction: column; align-items: flex-start; margin-bottom: 40px; }
        .full-logo { width: 160px; height: auto; margin-bottom: 5px; }
        .tagline-bold { font-weight: 900; font-size: 0.75rem; color: #000; letter-spacing: 0.5px; }

        /* Summary Sections */
        .section-title { font-size: 1.1rem; font-weight: 700; margin: 25px 0 10px; border-bottom: 1.5px solid #eee; padding-bottom: 5px; }
        .summary-grid { display: grid; grid-template-columns: 180px 1fr; row-gap: 8px; font-size: 0.85rem; margin-bottom: 30px; }
        .label { font-weight: 600; color: #555; }
        .value { font-weight: 700; color: #000; }

        /* Filter Box */
        .filter-selection-box { background: #f4f6f8; border-radius: 4px; padding: 15px; margin-bottom: 30px; display: grid; grid-template-columns: 180px 1fr; row-gap: 12px; font-size: 0.85rem; }

        /* Transactions Table */
        .table-title { font-size: 0.95rem; font-weight: 700; margin-bottom: 5px; }
        .table-subtitle { font-size: 0.75rem; color: #666; margin-bottom: 20px; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { border-top: 1.5px solid #000; border-bottom: 1.5px solid #000; text-align: left; padding: 12px 8px; font-size: 0.75rem; font-weight: 700; }
        td { padding: 12px 8px; font-size: 0.75rem; border-bottom: 1px solid #f0f0f0; }
        .amount-col { text-align: right; font-weight: 700; }
        .credit { color: #00816F; } /* IDFC Green for credits */

        /* Footer */
        .footer { position: absolute; bottom: 0; width: 100%; display: flex; justify-content: flex-end; font-size: 0.7rem; color: #666; padding-top: 20px; border-top: 1px solid #eee; }

        @media print {
            .no-print { display: none; }
            body { padding: 0; }
            .pdf-page { max-width: 100%; }
        }
        #loader-wrapper {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #ffffff; display: flex; justify-content: center; align-items: center;
            z-index: 999999;
        }
        #loader-wrapper img { width: 100px; }
    </style>
</head>
<body>
    <div id="loader-wrapper" class="no-print"><img src="assets/images/loader.gif" alt="Loading..."></div>

    <div class="pdf-page">
        <header class="header-main">
            <img src="assets/images/idfclogofull.png" alt="IDFC FIRST Bank" class="full-logo">
            <div class="tagline-bold">ALWAYS YOU FIRST</div>
        </header>

        <h2 class="section-title">Smart Summary</h2>
        <div class="summary-grid" id="summary-info">
            <span class="label">Name</span> <span class="value" id="pdf-name">...</span>
            <span class="label">Customer ID</span> <span class="value" id="pdf-cust-id">...</span>
            <span class="label">CKYC ID</span> <span class="value" id="pdf-ckyc">...</span>
            <span class="label">Address</span> <span class="value" id="pdf-address" style="white-space: pre-wrap;">...</span>
        </div>

        <h2 class="section-title">Filter / Search Selection</h2>
        <div class="filter-selection-box">
            <span class="label">Accounts</span> <span class="value" id="pdf-account">...</span>
            <span class="label">Date Range</span> <span class="value" id="pdf-date-range">...</span>
        </div>

        <div class="table-container">
            <p class="table-title">Transactions Based On Applied Selections</p>
            <p class="table-subtitle">(Upto 2000 transactions downloaded)</p>

            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Payment Type</th>
                        <th>Transaction Name</th>
                        <th>Category</th>
                        <th class="amount-col">Amount</th>
                    </tr>
                </thead>
                <tbody id="pdf-txn-body">
                    <!-- Dynamic Rows -->
                </tbody>
            </table>
        </div>

        <div class="footer">
            Page 1 of 1
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const user = await loadAppData();
            if (!user) return;

            // Populate Summary
            document.getElementById('pdf-name').textContent = user.fullName || 'User';
            document.getElementById('pdf-cust-id').textContent = user.customerId || '-';
            document.getElementById('pdf-ckyc').textContent = user.ckycId || '**********7254';
            document.getElementById('pdf-address').textContent = user.address || 'Address not set in Admin Panel';

            const lastFour = user.accountNumber ? user.accountNumber.slice(-4) : 'XXXX';
            document.getElementById('pdf-account').textContent = `IDFC FIRST xx ${lastFour} ${user.accountNumber || ''}`;

            const todayStr = new Date().toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
            document.getElementById('pdf-date-range').textContent = `Upto ${todayStr}`;

            // Populate Table
            const allTxns = getTransactionsForActiveUser();

            // Filter by savings (Account Statement usually only shows savings)
            const txns = allTxns.filter(t => !t.category || t.category === 'savings');

            const body = document.getElementById('pdf-txn-body');

            if (txns.length === 0) {
                body.innerHTML = '<tr><td colspan="5" style="text-align:center; padding: 40px;">No transactions found for the selected period.</td></tr>';
            } else {
                txns.forEach(txn => {
                    const isCredit = txn.amount.includes('+') || txn.desc.toLowerCase().includes('deposit');
                    const paymentType = isCredit ? 'Others' : 'Fees & charges';
                    const category = isCredit ? 'Interests & Dividends' : 'Others';

                    const row = `
                        <tr>
                            <td>${txn.date}</td>
                            <td>${paymentType}</td>
                            <td style="font-weight: 500;">${txn.desc}</td>
                            <td>${category}</td>
                            <td class="amount-col ${isCredit ? 'credit' : ''}">${isCredit ? '+ ' : ''}${txn.amount.replace('+', '')}</td>
                        </tr>`;
                    body.insertAdjacentHTML('beforeend', row);
                });
            }

            // Hide loader and trigger print
            setTimeout(() => {
                document.getElementById('loader-wrapper').style.display = 'none';

                if (window.location.search.includes('autoprint=true')) {
                    // Send notification to Android App
                    if (window.Android) {
                        Android.showNotification("Account Statement is ready for download.");
                    }

                    window.print();
                }
            }, 800);
        });
    </script>
</body>
</html>
