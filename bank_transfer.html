<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bank Transfer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <style>
        body {
            background-color: #f8f9fa;
            margin: 0;
            padding: 0;
        }
        .header {
            background: white;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #eee;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-left {
            display: flex;
            align-items: center;
        }
        .header-right {
            display: flex;
            align-items: center;
        }
        .back-btn, .icon-btn {
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
            color: #931A1D;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .back-btn {
            margin-right: 15px;
        }
        .header-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #1A1A1A;
        }
        .content {
            padding: 20px;
            text-align: center;
            margin-top: 50px;
        }
        .coming-soon {
            color: #666;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-left">
            <button class="back-btn" onclick="window.history.back()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            </button>
            <span class="header-title">Bank Transfer</span>
        </div>
        <div class="header-right">
            <button class="icon-btn">
                <img src="assets/images/support.svg" alt="Support" style="width: 24px; height: 24px;">
            </button>
            <button class="icon-btn" onclick="window.location.href='dashboard.html'" style="margin-left: 15px;">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>
    </header>

    <main class="content">
        <div class="coming-soon">
            Bank Transfer functionality coming soon...
        </div>
    </main>

    <script src="js/core_manager.js"></script>
</body>
</html>
