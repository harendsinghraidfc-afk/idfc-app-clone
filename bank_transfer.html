<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bank Transfer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <style>
        body {
            background-color: #f8f9fa;
            margin: 0;
            padding: 0;
        }
        .header {
            background: white;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #eee;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-left {
            display: flex;
            align-items: center;
        }
        .header-right {
            display: flex;
            align-items: center;
        }
        .back-btn, .icon-btn {
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
            color: #931A1D;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .back-btn {
            margin-right: 15px;
        }
        .payee-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 70vh;
            padding: 20px;
        }
        .empty-state-icon {
            width: 120px;
            height: 120px;
            background-color: #FEF5D1;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }
        .add-payee-btn {
            background-color: #000000;
            color: white;
            border: none;
            padding: 12px 40px;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            transition: transform 0.2s;
        }
        .add-payee-btn:active {
            transform: scale(0.98);
        }
        .header-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #1A1A1A;
        }
        .content {
            padding: 20px;
            text-align: center;
            margin-top: 50px;
        }
        .coming-soon {
            color: #666;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-left">
            <button class="back-btn" onclick="window.history.back()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            </button>
            <span class="header-title">Bank Transfer</span>
        </div>
        <div class="header-right">
            <button class="icon-btn">
                <img src="assets/images/support.svg" alt="Support" style="width: 24px; height: 24px;">
            </button>
            <button class="icon-btn" onclick="window.location.href='dashboard.html'" style="margin-left: 15px;">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>
    </header>

    <main class="content">
        <div class="payee-section">
            <div class="empty-state-icon">
                <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="#D4A017" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                    <circle cx="8.5" cy="7" r="4"></circle>
                    <line x1="20" y1="8" x2="20" y2="14"></line>
                    <line x1="23" y1="11" x2="17" y2="11"></line>
                </svg>
            </div>
            <h3 style="margin: 20px 0 30px; font-weight: 700; color: #333; font-size: 1.1rem;">You have not added any payees yet</h3>

            <button class="add-payee-btn" onclick="window.location.href='add_payee.html'">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 8px;">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                Add Payee
            </button>

            <button class="add-payee-btn" style="margin-top:14px;background:#1b1f3a;color:#fff;border-color:#1b1f3a;" onclick="openQuickTransfer()">
                ⚡ Quick Transfer (Demo)
            </button>
        </div>
    </main>

    <!-- Quick Transfer Modal -->
    <div id="qtModal" style="position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:99998;display:none;align-items:flex-end;justify-content:center;">
      <div style="background:#fff;width:100%;max-width:460px;border-top-left-radius:20px;border-top-right-radius:20px;padding:20px;max-height:92vh;overflow:auto;">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <h3 style="margin:0 0 10px;font-size:17px;">Quick Bank Transfer</h3>
          <button onclick="document.getElementById('qtModal').style.display='none'" style="border:0;background:transparent;font-size:22px;cursor:pointer;color:#888;">&times;</button>
        </div>

        <div style="margin-top:10px;">
          <label style="font-size:12px;color:#666;">Transfer Mode</label>
          <select id="qtMode" style="width:100%;padding:12px;border:1.5px solid #dfe5ef;border-radius:12px;margin-top:6px;font-size:14px;">
            <option value="IMPS">IMPS (Instant)</option>
            <option value="NEFT">NEFT (2 hours)</option>
            <option value="RTGS">RTGS (Above ₹2 Lakh)</option>
          </select>
        </div>

        <div style="margin-top:14px;">
          <label style="font-size:12px;color:#666;">Beneficiary (IDFC Customer ID for internal transfer, or Beneficiary A/C no. for external)</label>
          <div style="display:flex;gap:8px;margin-top:6px;">
            <input id="qtTo" type="text" placeholder="Customer ID / Beneficiary ID" style="flex:1;padding:12px;border:1.5px solid #dfe5ef;border-radius:12px;outline:none;font-size:14px;">
            <button onclick="findQt()" style="padding:12px 14px;border:0;background:#1b1f3a;color:#fff;border-radius:12px;font-size:13px;font-weight:600;">Find</button>
          </div>
          <div id="qtInfo" style="margin-top:8px;font-size:12px;color:#555;min-height:18px;"></div>
        </div>

        <div style="margin-top:14px;">
          <label style="font-size:12px;color:#666;">Amount (₹)</label>
          <input id="qtAmount" type="number" min="1" step="0.01" placeholder="0.00" style="width:100%;box-sizing:border-box;padding:12px;border:1.5px solid #dfe5ef;border-radius:12px;outline:none;font-size:18px;font-weight:600;margin-top:6px;">
          <div id="qtBal" style="font-size:12px;color:#666;margin-top:6px;"></div>
        </div>

        <div style="margin-top:14px;">
          <label style="font-size:12px;color:#666;">Remarks (optional)</label>
          <input id="qtRemarks" type="text" placeholder="Add a note" style="width:100%;box-sizing:border-box;padding:12px;border:1.5px solid #dfe5ef;border-radius:12px;outline:none;font-size:14px;margin-top:6px;">
        </div>

        <button onclick="submitQt()" style="width:100%;margin-top:18px;padding:14px;border:0;background:#8B1538;color:#fff;border-radius:14px;font-size:15px;font-weight:700;cursor:pointer;">Transfer &amp; Verify MPIN</button>
      </div>
    </div>

    <script src="js/core_manager.js"></script>
    <script src="js/user_payment_flow.js"></script>
    <script>
        let qtPayee = null;
        function openQuickTransfer() {
            document.getElementById('qtModal').style.display='flex';
            document.getElementById('qtTo').value='';
            document.getElementById('qtAmount').value='';
            document.getElementById('qtRemarks').value='';
            document.getElementById('qtInfo').textContent='';
            qtPayee=null;
            try { document.getElementById('qtBal').textContent='Available Balance: ' + formatCurrency(userGetMyBalance()); } catch(e){}
        }
        function findQt() {
            const q = document.getElementById('qtTo').value.trim();
            const u = findUserByPhoneOrCid(q);
            if (u) {
                qtPayee = { customerId: u.customerId, name: u.fullName || u.name || 'User' };
                document.getElementById('qtInfo').innerHTML = `<span style="color:#0a8f51;">✓ IDFC Internal Transfer → MATCHED PAIR: <b>${qtPayee.name}</b> (${u.customerId})</span>`;
            } else {
                qtPayee = { name: 'External Beneficiary ' + q, accountNumber: q };
                document.getElementById('qtInfo').innerHTML = `<span style="color:#c60;">External bank: will record as STANDALONE debit in your account only (demo).</span>`;
            }
        }
        function submitQt() {
            const amt = parseFloat(document.getElementById('qtAmount').value);
            if (!amt || amt <= 0) { alert('Enter amount'); return; }
            if (!qtPayee) { findQt(); if (!qtPayee) return; }
            const mode = document.getElementById('qtMode').value;
            const remarks = document.getElementById('qtRemarks').value;
            userBankTransfer(qtPayee, amt, { mode, remarks });
        }
    </script>
</body>
</html>
