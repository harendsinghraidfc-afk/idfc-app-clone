<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IDFC Auth - Seamless Transform</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/auth.css">
    <style>
        #loader-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999999;
            transition: opacity 0.5s ease;
        }
        #loader-wrapper img {
            width: 100px;
            height: auto;
        }
    </style>
</head>
<body>
    <div id="loader-wrapper">
        <img src="assets/images/loader.gif" alt="Loading...">
    </div>
    <div id="main-container">
        <!-- Header -->
        <header class="app-header">
            <img src="assets/images/logo_v2.svg" class="header-logo" alt="IDFC Logo">

            <div class="header-right">
                <div class="app-otp-pill">App OTP</div>

                <img src="assets/images/support.svg" class="header-icon" alt="Support">
                <img src="assets/images/menu.svg" class="header-icon" alt="Menu">
            </div>
        </header>

        <!-- Perfect Transforming Curve Background -->
        <div class="curve-bg"></div>

        <!-- Shield (Moved outside auth-body to sync positioning with curve-bg) -->
        <div class="shield-container">
            <img src="assets/images/shield_hq.png" class="shield-icon" alt="Verified">
        </div>

        <!-- Auth Content -->
        <div class="auth-body">
            <div class="welcome-section">
                <span class="light">Welcome</span>
                <span class="bold">Lokesh</span>
            </div>

            <div class="mpin-interaction">
                <p class="label">Please enter your MPIN</p>
                <div class="mpin-grid">
                    <input type="password" maxlength="1" class="mpin-box" inputmode="numeric">
                    <input type="password" maxlength="1" class="mpin-box" inputmode="numeric">
                    <input type="password" maxlength="1" class="mpin-box" inputmode="numeric">
                    <input type="password" maxlength="1" class="mpin-box" inputmode="numeric">
                </div>
                <p id="error-msg" style="color: #931A1D; font-size: 0.8rem; font-weight: 600; margin-top: 10px; display: none;">You Entered Wrong MPIN</p>
                <a href="#" class="forgot-link">Forgot MPIN?</a>
            </div>
        </div>

        <!-- Bottom Actions -->
        <div class="bottom-actions">
            <div class="action-box">
                <div class="icon-circle outline">
                    <img src="assets/images/bank_block.svg" class="action-icon" alt="Block">
                </div>
                <p class="action-text">Block/Unblock</p>
            </div>
            <div class="action-box">
                <div class="icon-circle outline">
                    <img src="assets/images/user_add.svg" class="action-icon" alt="Login">
                </div>
                <p class="action-text">Login another</p>
            </div>
            <div class="action-box">
                <div class="icon-circle solid">
                    <img src="assets/images/qr_scan.svg" class="action-icon" alt="QR">
                </div>
                <p class="action-text">Scan QR</p>
            </div>
            <div class="action-box">
                <div class="icon-circle outline">
                    <img src="assets/images/card_manage.svg" class="action-icon" alt="Card">
                </div>
                <p class="action-text">Manage Card</p>
            </div>
        </div>

        <div class="footer-ver">Version 2.71(20388)</div>
    </div>

    <script src="js/core_manager.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const nameElement = document.querySelector('.welcome-section .bold');

            // Show skeleton while fetching
            nameElement.classList.add('name-skeleton');

            try {
                // Fetch fresh data from server with cache-busting
                const response = await fetch('server_backend/users.json?t=' + new Date().getTime());

                // Artificial delay to see the shimmer (optional, remove for instant feel)
                await new Promise(resolve => setTimeout(resolve, 1000));

                if (response.ok) {
                    const users = await response.json();
                    if (users && users.length > 0) {
                        const user = users[0];
                        nameElement.classList.remove('name-skeleton');
                        nameElement.textContent = user.welcomeName || 'User';

                        localStorage.setItem('idfc_app_user_data', JSON.stringify(user));
                    }
                }
            } catch (e) {
                console.error('Failed to fetch user name', e);
                nameElement.classList.remove('name-skeleton');

                const localUser = JSON.parse(localStorage.getItem('idfc_app_user_data'));
                nameElement.textContent = localUser ? localUser.welcomeName : 'User';
            }
        });
    </script>
    <script>
        window.addEventListener('load', function() {
            var loader = document.getElementById('loader-wrapper');
            // Ensure the loader stays for at least 1000ms
            setTimeout(function() {
                loader.style.opacity = '0';
                setTimeout(function() {
                    loader.style.display = 'none';
                }, 500); // Wait for fade out animation
            }, 1000);
        });
    </script>
</body>
</html>
