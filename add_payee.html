<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Add Payee</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <style>
        body {
            background-color: #FEFDF6;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }
        .header {
            background: white;
            padding: 15px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #f0f0f0;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-left {
            display: flex;
            align-items: center;
        }
        .back-btn {
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
            color: #666;
            margin-right: 12px;
            display: flex;
            align-items: center;
        }
        .header-title {
            font-size: 1rem;
            font-weight: 700;
            color: #1A1A1A;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .form-container {
            padding: 15px 18px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-bottom: 100px;
        }
        .input-group {
            position: relative;
            background: white;
            border-radius: 8px;
        }
        .custom-input, .custom-dropdown-trigger {
            width: 100%;
            height: 54px;
            padding: 0 15px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            font-size: 0.95rem;
            box-sizing: border-box;
            background-color: white;
            color: #333;
            outline: none;
            display: flex;
            align-items: center;
            cursor: pointer;
        }
        .custom-input { cursor: text; }
        .custom-dropdown-trigger { justify-content: space-between; }

        .dropdown-chevron {
            font-size: 24px;
            color: #999;
            transform: rotate(90deg);
        }

        .custom-input::placeholder { color: #999; }
        .custom-input:focus { border-color: #ccc; }

        /* Custom Dropdown Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.4);
            display: none;
            z-index: 1000;
        }
        .bank-list-container {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            max-height: 80%;
            background: white;
            border-radius: 20px 20px 0 0;
            z-index: 1001;
            display: none;
            flex-direction: column;
            animation: slideUp 0.3s ease-out;
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        .bank-list-header {
            padding: 20px;
            font-weight: 700;
            font-size: 1.1rem;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .bank-list-scroll {
            overflow-y: auto;
            padding: 10px 0;
        }
        .bank-item {
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .bank-item:active { background: #f8f8f8; }
        .bank-logo {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: contain;
            background: #f5f5f5;
            padding: 4px;
            border: 1px solid #eee;
        }
        .bank-name { font-size: 0.95rem; color: #333; font-weight: 500; }

        .selected-bank-info { display: flex; align-items: center; gap: 10px; }
        .selected-bank-logo { width: 24px; height: 24px; border-radius: 50%; object-fit: contain; display: none; }

        /* Info Box */
        .info-box {
            background-color: #FEF9E7;
            border-radius: 8px;
            padding: 12px 15px;
            display: flex;
            gap: 12px;
            margin-top: 5px;
        }
        .info-icon { flex-shrink: 0; margin-top: 2px; }
        .info-text { font-size: 0.8rem; line-height: 1.4; color: #666; margin: 0; }

        .submit-btn-fixed {
            position: fixed;
            bottom: 20px;
            left: 18px;
            right: 18px;
            background: #FEFDF6;
            padding-top: 10px;
        }
        .submit-btn {
            width: 100%;
            background-color: #000;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-left">
            <button class="back-btn" onclick="window.history.back()">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            </button>
            <span class="header-title">Add Payee</span>
        </div>
        <div class="header-right">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 18v-6a9 9 0 0 1 18 0v6"></path>
                <path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"></path>
            </svg>
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" onclick="window.location.href='dashboard.html'">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
        </div>
    </header>

    <main class="form-container">
        <div class="input-group">
            <div class="custom-dropdown-trigger" id="bank-dropdown-trigger">
                <div class="selected-bank-info">
                    <img src="" class="selected-bank-logo" id="current-bank-logo" alt="Bank Logo">
                    <span id="selected-bank-text" style="color: #999;">Select Bank</span>
                </div>
                <span class="dropdown-chevron">&rsaquo;</span>
            </div>
        </div>

        <div class="input-group">
            <input type="text" class="custom-input" placeholder="Account Number" maxlength="18">
        </div>

        <div class="input-group">
            <input type="text" class="custom-input" placeholder="Re-enter Account Number" maxlength="18">
        </div>

        <div class="input-group">
            <input type="text" class="custom-input" placeholder="IFSC Code" style="text-transform: uppercase;">
        </div>

        <div class="input-group">
            <input type="text" class="custom-input" placeholder="Payee's Name">
        </div>

        <div class="info-box">
            <div class="info-icon">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="16" x2="12" y2="12"></line>
                    <line x1="12" y1="8" x2="12.01" y2="8"></line>
                </svg>
            </div>
            <p class="info-text">
                Funds will be transferred using payee's account number and IFSC. IDFC FIRST Bank will not validate Bank Account or Credit Card number and is not responsible for unintended fund transfers.
            </p>
        </div>

        <div class="input-group">
            <input type="text" class="custom-input" placeholder="Nickname (Optional)">
        </div>

        <div class="submit-btn-fixed">
            <button class="submit-btn">Confirm & Add payee</button>
        </div>
    </main>

    <!-- Bank Selection Modal -->
    <div class="modal-overlay" id="modal-overlay"></div>
    <div class="bank-list-container" id="bank-modal">
        <div class="bank-list-header">
            <span>Select Bank</span>
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="close-modal">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
        </div>
        <div class="bank-list-scroll" id="bank-list">
            <!-- Items injected by JS -->
        </div>
    </div>

    <script>
        const banks = [
            { name: "IDFC FIRST Bank", domain: "idfcfirstbank.com" },
            { name: "HDFC Bank", domain: "hdfcbank.com" },
            { name: "ICICI Bank", domain: "icicibank.com" },
            { name: "State Bank of India", domain: "sbi.co.in" },
            { name: "Axis Bank", domain: "axisbank.com" },
            { name: "Kotak Mahindra Bank", domain: "kotak.com" },
            { name: "IndusInd Bank", domain: "indusind.com" },
            { name: "Bank of Baroda", domain: "bankofbaroda.in" },
            { name: "Punjab National Bank", domain: "pnbindia.in" },
            { name: "Canara Bank", domain: "canarabank.com" },
            { name: "Union Bank of India", domain: "unionbankofindia.co.in" },
            { name: "Yes Bank", domain: "yesbank.in" },
            { name: "Federal Bank", domain: "federalbank.co.in" },
            { name: "RBL Bank", domain: "rblbank.com" },
            { name: "IDBI Bank", domain: "idbibank.in" },
            { name: "Indian Bank", domain: "indianbank.in" },
            { name: "Bank of India", domain: "bankofindia.co.in" }
        ];

        const trigger = document.getElementById('bank-dropdown-trigger');
        const modal = document.getElementById('bank-modal');
        const overlay = document.getElementById('modal-overlay');
        const closeBtn = document.getElementById('close-modal');
        const bankList = document.getElementById('bank-list');
        const selectedText = document.getElementById('selected-bank-text');
        const selectedLogo = document.getElementById('current-bank-logo');

        // Build Bank List
        banks.forEach(bank => {
            const div = document.createElement('div');
            div.className = 'bank-item';
            const logoUrl = `https://logo.clearbit.com/${bank.domain}`;
            div.innerHTML = `
                <img src="${logoUrl}" class="bank-logo" onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(bank.name)}&background=random'">
                <span class="bank-name">${bank.name}</span>
            `;
            div.onclick = () => {
                selectedText.textContent = bank.name;
                selectedText.style.color = "#333";
                selectedLogo.src = logoUrl;
                selectedLogo.style.display = "block";
                closeBankModal();
            };
            bankList.appendChild(div);
        });

        trigger.onclick = () => {
            modal.style.display = 'flex';
            overlay.style.display = 'block';
            document.body.style.overflow = 'hidden';
        };

        function closeBankModal() {
            modal.style.display = 'none';
            overlay.style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        overlay.onclick = closeBankModal;
        closeBtn.onclick = closeBankModal;
    </script>
    <script src="js/core_manager.js"></script>
</body>
</html>
