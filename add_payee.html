<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Add Payee</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <style>
        body {
            background-color: #f8f9fa;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }
        .header {
            background: white;
            padding: 15px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #f0f0f0;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-left {
            display: flex;
            align-items: center;
        }
        .back-btn {
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
            color: #666;
            margin-right: 12px;
            display: flex;
            align-items: center;
        }
        .header-title {
            font-size: 1rem;
            font-weight: 700;
            color: #1A1A1A;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .form-container {
            padding: 15px 18px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .input-group {
            position: relative;
            background: white;
            border-radius: 8px;
            overflow: hidden;
        }
        .custom-input, .custom-select {
            width: 100%;
            height: 54px;
            padding: 0 15px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            font-size: 0.95rem;
            box-sizing: border-box;
            background-color: white;
            color: #333;
            outline: none;
            display: flex;
            align-items: center;
        }
        .custom-select {
            appearance: none;
            -webkit-appearance: none;
        }
        .select-wrapper::after {
            content: "\203A";
            font-size: 24px;
            color: #999;
            transform: rotate(90deg);
            position: absolute;
            right: 15px;
            top: 50%;
            margin-top: -16px;
            pointer-events: none;
        }
        .custom-input::placeholder {
            color: #999;
        }
        .custom-input:focus, .custom-select:focus {
            border-color: #931A1D;
        }

        /* Info Box */
        .info-box {
            background-color: #FEF9E7;
            border-radius: 8px;
            padding: 12px 15px;
            display: flex;
            gap: 12px;
            margin-top: 5px;
        }
        .info-icon {
            flex-shrink: 0;
            margin-top: 2px;
        }
        .info-text {
            font-size: 0.8rem;
            line-height: 1.4;
            color: #666;
            margin: 0;
        }

        .submit-btn-fixed {
            position: fixed;
            bottom: 20px;
            left: 18px;
            right: 18px;
        }
        .submit-btn {
            width: 100%;
            background-color: #000;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .submit-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-left">
            <button class="back-btn" onclick="window.history.back()">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            </button>
            <span class="header-title">Add Payee</span>
        </div>
        <div class="header-right">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 18v-6a9 9 0 0 1 18 0v6"></path>
                <path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"></path>
            </svg>
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" onclick="window.location.href='dashboard.html'">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
        </div>
    </header>

    <main class="form-container">
        <div class="input-group select-wrapper">
            <select class="custom-select" id="bank-select">
                <option value="" disabled selected>Select Bank</option>
                <option value="idfc">IDFC FIRST Bank</option>
                <option value="sbi">State Bank of India</option>
                <option value="hdfc">HDFC Bank</option>
                <option value="icici">ICICI Bank</option>
                <option value="axis">Axis Bank</option>
                <option value="other">Other Banks</option>
            </select>
        </div>

        <div class="input-group">
            <input type="text" class="custom-input" placeholder="Account Number" maxlength="18">
        </div>

        <div class="input-group">
            <input type="text" class="custom-input" placeholder="Re-enter Account Number" maxlength="18">
        </div>

        <div class="input-group">
            <input type="text" class="custom-input" placeholder="IFSC Code" style="text-transform: uppercase;">
        </div>

        <div class="input-group">
            <input type="text" class="custom-input" placeholder="Payee's Name">
        </div>

        <div class="info-box">
            <div class="info-icon">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="16" x2="12" y2="12"></line>
                    <line x1="12" y1="8" x2="12.01" y2="8"></line>
                </svg>
            </div>
            <p class="info-text">
                Funds will be transferred using payee's account number and IFSC. IDFC FIRST Bank will not validate Bank Account or Credit Card number and is not responsible for unintended fund transfers.
            </p>
        </div>

        <div class="input-group">
            <input type="text" class="custom-input" placeholder="Nickname (Optional)">
        </div>

        <div class="submit-btn-fixed">
            <button class="submit-btn">Proceed</button>
        </div>
    </main>

    <script src="js/core_manager.js"></script>
</body>
</html>
