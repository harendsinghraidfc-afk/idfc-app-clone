<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My QR code</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/my_qr.css">
    <script src="js/core_manager.js"></script>
    <!-- QR Code Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- HTML to Canvas for sharing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
    <div class="qr-container">
        <!-- Header -->
        <header class="header">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" onclick="window.history.back()">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
            <span class="header-title">My QR code</span>
            <div class="header-icons">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2">
                    <path d="M3 18v-6a9 9 0 0 1 18 0v6"></path>
                    <path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"></path>
                </svg>
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" onclick="window.location.href='dashboard.html'">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Shareable Area (Everything inside here will be converted to image) -->
            <div id="share-area" style="width: 100%; display: flex; flex-direction: column; align-items: center; background: white; padding-top: 20px;">
                <div class="user-name" id="display-name">...</div>
                <div class="upi-id-display">My UPI ID: <span id="display-upi" style="font-weight: 600;">...</span></div>

                <p class="instruction-text">Use this QR code to transfer any amount</p>

                <div class="qr-wrapper" style="background: white; border: none; box-shadow: none; margin-bottom: 20px;">
                    <div id="qrcode"></div>
                </div>

                <!-- Brand Logo for Share/Download -->
                <img src="assets/images/idfclogofull.png" alt="IDFC Bank" style="width: 140px; margin-bottom: 25px; margin-top: 10px;">
            </div>

            <!-- Action Buttons (NOT in share-area) -->
            <div class="action-buttons">
                <div class="action-item" onclick="handleImageAction('share')">
                    <div class="circle-btn">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
                    </div>
                    <span class="action-label">Share</span>
                </div>
                <div class="action-item" onclick="handleImageAction('download')">
                    <div class="circle-btn">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                    </div>
                    <span class="action-label">Download</span>
                </div>
            </div>

            <!-- Fixed Amount Card -->
            <div class="fixed-amount-card" style="cursor: pointer; padding: 15px 20px;">
                <div class="card-left">
                    <div class="fixed-qr-icon">
                        <svg viewBox="0 0 512 512" width="24" height="24" xmlns="http://www.w3.org/2000/svg" fill="currentColor">
                            <polygon points="48 48 176 48 176 16 16 16 16 176 48 176 48 48"></polygon>
                            <path d="M176,176V80H80v96h96Zm-64-64h32v32H112Z"></path>
                            <polygon points="328 48 464 48 464 176 496 176 496 16 328 16 328 48"></polygon>
                            <path d="M432,176V80H336v96h96Zm-64-64h32v32H368Z"></path>
                            <polygon points="176 464 48 464 48 336 16 336 16 496 176 496 176 464"></polygon>
                            <path d="M176,336H80v96h96V336Zm-32,64H112V368h32Z"></path>
                            <polygon points="464 464 328 464 328 496 496 496 496 336 464 336 464 464"></polygon>
                            <polygon points="272 304 400 304 400 368 432 368 432 272 272 272 272 304"></polygon>
                            <polygon points="432 432 432 400 240 400 240 272 80 272 80 304 208 304 208 432 432 432"></polygon>
                            <rect width="32" height="96" x="208" y="80"></rect>
                            <polygon points="80 240 304 240 304 80 272 80 272 208 80 208 80 240"></polygon>
                            <rect width="96" height="32" x="336" y="208"></rect>
                            <rect width="32" height="32" x="336" y="336"></rect>
                            <rect width="32" height="32" x="272" y="336"></rect>
                        </svg>
                    </div>
                    <div class="card-text" style="color: #444; font-size: 0.9rem;">Generate QR code to receive a fixed amount</div>
                </div>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
            </div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const user = await loadAppData();
            if (user) {
                const name = user.fullName || 'User';
                const upiId = user.upiId || `${user.accountNumber.replace(/ /g, '')}@idfcfirst`;

                document.getElementById('display-name').textContent = name;
                document.getElementById('display-upi').textContent = upiId;

                // Generate QR Code
                const upiUrl = `upi://pay?pa=${upiId}&pn=${encodeURIComponent(name)}&cu=INR`;

                new QRCode(document.getElementById("qrcode"), {
                    text: upiUrl,
                    width: 200,
                    height: 200,
                    colorDark : "#000000",
                    colorLight : "#ffffff",
                    correctLevel : QRCode.CorrectLevel.H
                });
            }
        });

        async function handleImageAction(type) {
            const element = document.getElementById('share-area');
            try {
                const canvas = await html2canvas(element, { scale: 3, backgroundColor: '#ffffff', logging: false });
                const base64 = canvas.toDataURL('image/png').split(',')[1];
                const fileName = "IDFC_QR_" + Date.now() + ".png";

                if (window.Android) {
                    if (type === 'share') {
                        window.Android.shareImage(base64, fileName);
                    } else {
                        window.Android.downloadImage(base64, fileName);
                    }
                } else {
                    // Browser Fallback
                    const link = document.createElement('a');
                    link.download = fileName;
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                }
            } catch (e) {
                console.error("Capture failed", e);
                alert("Error: " + e.message);
            }
        }
    </script>
</body>
</html>
