<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Admin - Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/admin_style.css">
    <style>
        #loader-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999999;
            transition: opacity 0.5s ease;
        }
        #loader-wrapper img {
            width: 100px;
            height: auto;
        }
    </style>
</head>
<body>
    <div id="loader-wrapper">
        <img src="../assets/images/loader.gif" alt="Loading...">
    </div>
    <!-- Side Menu -->
    <div class="sidebar">
        <div class="sidebar-brand">IDFC ADMIN</div>
        <ul class="nav-menu">
            <li class="nav-item">
                <a href="dashboard.html" class="nav-link active">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                    Dashboard
                </a>
            </li>
            <li class="nav-item">
                <a href="transactions.html" class="nav-link">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><path d="M9 12l2 2 4-4"></path></svg>
                    Transactions
                </a>
            </li>
            <li class="nav-item">
                <a href="users.html" class="nav-link">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    Users
                </a>
            </li>
        </ul>
    </div>

    <div class="main-wrapper">
        <div class="glass-container">
            <div class="header-icon">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                    <circle cx="8.5" cy="7" r="4"></circle>
                    <line x1="20" y1="8" x2="20" y2="14"></line>
                    <line x1="17" y1="11" x2="23" y2="11"></line>
                </svg>
            </div>
            <h1>Add New User</h1>
            <p class="sub-heading">Register a new account on the server</p>

            <div class="form-grid">
                <div class="input-group">
                    <label>Welcome Name</label>
                    <input type="text" id="welcomeName" placeholder="e.g. Anit">
                </div>

                <div class="input-group">
                    <label>Full Name</label>
                    <input type="text" id="fullName" placeholder="e.g. Lokesh Chouhan">
                </div>

                <div class="input-group">
                    <label>Customer ID</label>
                    <input type="text" id="customerId" placeholder="Enter Customer ID">
                </div>

                <div class="input-group">
                    <label>Account Number</label>
                    <input type="text" id="accountNumber" placeholder="102 9516 XXXX">
                </div>

                <div class="input-group">
                    <label>IFSC Code</label>
                    <input type="text" id="ifscCode" placeholder="IDFB00XXXXX">
                </div>

                <div class="input-group">
                    <label>SWIFT Code</label>
                    <input type="text" id="swiftCode" placeholder="IDFB IN BB XXX">
                </div>

                <div class="input-group">
                    <label>Bank Name</label>
                    <input type="text" id="bankName" value="IDFC FIRST" placeholder="e.g. IDFC FIRST">
                </div>

                <div class="input-group">
                    <label>Branch Name</label>
                    <input type="text" id="branchName" placeholder="e.g. Sejawata Branch">
                </div>

                <div class="input-group">
                    <label>User MPIN</label>
                    <input type="password" id="mpin" maxlength="4" placeholder="Enter 4-digit PIN">
                </div>

                <div class="input-group">
                    <label>Available Balance</label>
                    <input type="text" id="availableBalance" placeholder="₹ 5,00,000.00">
                </div>
            </div>

            <button class="primary-btn">Create Account</button>
        </div>
    </div>

    <script src="js/data_manager.js"></script>
    <script src="js/admin_dashboard.js"></script>
    <script>
        window.addEventListener('load', function() {
            var loader = document.getElementById('loader-wrapper');
            // Ensure the loader stays for at least 1000ms
            setTimeout(function() {
                loader.style.opacity = '0';
                setTimeout(function() {
                    loader.style.display = 'none';
                }, 500); // Wait for fade out animation
            }, 1000);
        });
    </script>
</body>
</html>
