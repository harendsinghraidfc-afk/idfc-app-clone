<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Admin - Transactions</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/admin_style.css">
    <style>
        #loader-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999999;
            transition: opacity 0.5s ease;
        }
        #loader-wrapper img {
            width: 100px;
            height: auto;
        }
    </style>
</head>
<body>
    <div id="loader-wrapper">
        <img src="../assets/images/loader.gif" alt="Loading...">
    </div>
    <!-- Side Menu -->
    <div class="sidebar">
        <div class="sidebar-brand">IDFC ADMIN</div>
        <ul class="nav-menu">
            <li class="nav-item">
                <a href="dashboard.html" class="nav-link">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                    Dashboard
                </a>
            </li>
            <li class="nav-item">
                <a href="transactions.html" class="nav-link active">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><path d="M9 12l2 2 4-4"></path></svg>
                    Transactions
                </a>
            </li>
            <li class="nav-item">
                <a href="users.html" class="nav-link">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    Users
                </a>
            </li>
        </ul>
    </div>

    <div class="main-wrapper">
        <div class="glass-panel">
            <div class="panel-header">
                <h1>Recent Transactions</h1>
                <div style="display: flex; gap: 15px; align-items: center;">
                    <select id="user-selector" class="admin-select">
                        <option value="">Select a User</option>
                        <!-- Options will be loaded dynamically -->
                    </select>
                    <button class="add-txn-btn">+ Add Transaction</button>
                </div>
            </div>

            <div class="table-responsive" id="txn-table-wrapper" style="display: none;">
                <table class="txn-table">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Description</th>
                            <th>Amount</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="txn-list-body">
                        <!-- Transactions will be loaded here -->
                    </tbody>
                </table>
            </div>

            <div id="no-user-selected" style="text-align: center; padding: 100px 20px; color: rgba(255,255,255,0.4);">
                <p>Please select a user to view their transactions</p>
            </div>
        </div>
    </div>

    <!-- Transaction Modal -->
    <div id="txn-modal" class="modal">
        <div class="modal-content glass-panel">
            <h2 id="modal-title">Add Transaction</h2>
            <form id="txn-form">
                <input type="hidden" id="edit-txn-id">
                <div class="form-grid">
                    <div class="input-group">
                        <label>Date</label>
                        <input type="text" id="txn-date" placeholder="e.g. 07 Aug, 2026">
                    </div>
                    <div class="input-group">
                        <label>Description</label>
                        <input type="text" id="txn-desc" placeholder="e.g. UPI Payment">
                    </div>
                    <div class="input-group">
                        <label>Amount</label>
                        <input type="text" id="txn-amount" placeholder="e.g. ₹2,000.00">
                    </div>
                    <div class="input-group">
                        <label>Status</label>
                        <select id="txn-status" class="admin-select" style="width: 100%;">
                            <option value="unbilled">Unbilled</option>
                            <option value="approved">Approved</option>
                            <option value="billed">Billed</option>
                        </select>
                    </div>
                </div>
                <div style="display: flex; gap: 15px; margin-top: 20px;">
                    <button type="submit" class="primary-btn" style="flex: 1;">Save</button>
                    <button type="button" id="close-modal" class="primary-btn" style="flex: 1; background: #4a5568;">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/data_manager.js"></script>
    <script src="js/transactions.js"></script>
    <script>
        window.addEventListener('load', function() {
            var loader = document.getElementById('loader-wrapper');
            // Ensure the loader stays for at least 1000ms
            setTimeout(function() {
                loader.style.opacity = '0';
                setTimeout(function() {
                    loader.style.display = 'none';
                }, 500); // Wait for fade out animation
            }, 1000);
        });
    </script>
</body>
</html>
